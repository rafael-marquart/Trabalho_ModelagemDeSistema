<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Recuperação de senha</title><desc id="desc">Protótipo visual AcessaVagas. Identidade em roxo e lilás, slogan Acesso que transforma. Arquivo SVG editável e legível por ferramentas de texto.</desc><defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#20133F}.body{font-size:15px;fill:#6B647C}.label{font-size:14px;font-weight:600;fill:#20133F}.small{font-size:12px;fill:#6B647C}.link{font-size:13px;font-weight:600;fill:#6B2DBD}.btn{font-size:15px;font-weight:700;fill:white}</style></defs>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#FCFBFE"/><rect x="0" y="0" width="500" height="960" rx="0" fill="#F5F0FC"/><text x="60" y="320" font-size="42" fill="#4A148C" font-weight="700" text-anchor="start">AcessaVagas</text><text x="63" y="365" font-size="22" fill="#20133F" font-weight="500" text-anchor="start">Acesso que transforma.</text><text x="60" y="470" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">Acesso simples,</text><text x="60" y="508" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">seguro e inclusivo.</text><rect x="570" y="125" width="660" height="690" rx="24" fill="#FFFFFF" stroke="#E3DDED"/><text x="630" y="190" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">Recuperar senha</text><text x="630" y="235" font-size="15" fill="#6B647C" font-weight="400" text-anchor="start">Informe o e-mail cadastrado para receber</text><text x="630" y="259" font-size="15" fill="#6B647C" font-weight="400" text-anchor="start">as instruções de recuperação.</text><text x="630" y="340" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">E-mail</text><rect x="630" y="352" width="540" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="648" y="382" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">seuemail@exemplo.com</text><rect x="630" y="430" width="540" height="58" rx="12" fill="#6B2DBD"/><text x="900" y="466" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Enviar instruções</text><text x="630" y="550" font-size="14" fill="#6B2DBD" font-weight="600" text-anchor="start">← Voltar para o login</text>
</svg>