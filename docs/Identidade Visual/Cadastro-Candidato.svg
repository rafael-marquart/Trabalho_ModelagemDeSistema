<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cadastro — Candidato</title><desc id="desc">Protótipo visual AcessaVagas. Identidade em roxo e lilás, slogan Acesso que transforma. Arquivo SVG editável e legível por ferramentas de texto.</desc><defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#20133F}.body{font-size:15px;fill:#6B647C}.label{font-size:14px;font-weight:600;fill:#20133F}.small{font-size:12px;fill:#6B647C}.link{font-size:13px;font-weight:600;fill:#6B2DBD}.btn{font-size:15px;font-weight:700;fill:white}</style></defs>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#FCFBFE"/><rect x="0" y="0" width="500" height="960" rx="0" fill="#F5F0FC"/><text x="60" y="320" font-size="42" fill="#4A148C" font-weight="700" text-anchor="start">AcessaVagas</text><text x="63" y="365" font-size="22" fill="#20133F" font-weight="500" text-anchor="start">Acesso que transforma.</text><text x="60" y="470" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">Seu próximo passo</text><text x="60" y="508" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">começa aqui.</text><rect x="570" y="70" width="660" height="820" rx="24" fill="#FFFFFF" stroke="#E3DDED"/><text x="620" y="125" font-size="30" fill="#20133F" font-weight="700" text-anchor="start">Criar conta de candidato</text><text x="620" y="158" font-size="14" fill="#6B647C" font-weight="400" text-anchor="start">Preencha seus dados para começar.</text><text x="620" y="205" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">Nome completo</text><rect x="620" y="217" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="638" y="247" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">Seu nome completo</text><text x="620" y="317" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">E-mail</text><rect x="620" y="329" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="638" y="359" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">seuemail@exemplo.com</text><text x="620" y="429" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">CPF</text><rect x="620" y="441" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="638" y="471" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">000.000.000-00</text><text x="620" y="541" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">Data de nascimento</text><rect x="620" y="553" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="638" y="583" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">DD/MM/AAAA</text><text x="620" y="653" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">Senha</text><rect x="620" y="665" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="638" y="695" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">Crie uma senha</text><rect x="620" y="790" width="560" height="54" rx="12" fill="#6B2DBD"/><text x="900" y="823" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Criar conta de candidato</text><text x="620" y="870" font-size="13" fill="#6B2DBD" font-weight="600" text-anchor="start">← Voltar para o login</text>
