<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Login — escolha de perfil</title><desc id="desc">Protótipo visual AcessaVagas. Identidade em roxo e lilás, slogan Acesso que transforma. Arquivo SVG editável e legível por ferramentas de texto.</desc><defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#20133F}.body{font-size:15px;fill:#6B647C}.label{font-size:14px;font-weight:600;fill:#20133F}.small{font-size:12px;fill:#6B647C}.link{font-size:13px;font-weight:600;fill:#6B2DBD}.btn{font-size:15px;font-weight:700;fill:white}</style></defs>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#FCFBFE"/><rect x="0" y="0" width="570" height="960" rx="0" fill="#F5F0FC"/><circle cx="-10" cy="0" r="220" fill="#E5D9F6"/><circle cx="60" cy="930" r="160" fill="#D6C3F1"/><circle cx="480" cy="940" r="120" fill="#E8DDF7"/>
<g fill="#4A148C"><circle cx="228" cy="210" r="24"/><path d="M204 244 Q230 225 251 250 L292 316 Q299 330 284 337 L267 341 Q258 341 252 330 L224 286 L202 329 Q194 344 178 337 Q166 330 173 315Z"/><path d="M185 292 A26 26 0 1 0 214 335" fill="none" stroke="#4A148C" stroke-width="10" stroke-linecap="round"/></g><g fill="#C6A7F2"><rect x="296" y="236" width="15" height="37" rx="8" transform="rotate(40 303 254)"/><rect x="314" y="267" width="14" height="34" rx="7" transform="rotate(80 321 284)"/><rect x="314" y="305" width="14" height="30" rx="7" transform="rotate(100 321 320)"/></g>
<text x="70" y="405" font-size="48" fill="#4A148C" font-weight="700" text-anchor="start">AcessaVagas</text><text x="75" y="451" font-size="25" fill="#20133F" font-weight="500" text-anchor="start">Acesso que transforma.</text><text x="76" y="540" font-size="34" fill="#20133F" font-weight="700" text-anchor="start">Mais inclusão,</text><text x="76" y="582" font-size="34" fill="#20133F" font-weight="700" text-anchor="start">mais oportunidades.</text><text x="78" y="650" font-size="16" fill="#6B647C" font-weight="400" text-anchor="start">Encontre oportunidades alinhadas ao seu perfil e</text><text x="78" y="676" font-size="16" fill="#6B647C" font-weight="400" text-anchor="start">empresas que levam acessibilidade a sério.</text>
<rect x="76" y="752" width="176" height="42" rx="18" fill="#FFFFFF" stroke="#E3DDED"/><text x="115" y="778" font-size="13" fill="#4A148C" font-weight="600" text-anchor="start">Acessibilidade real</text><rect x="264" y="752" width="174" height="42" rx="18" fill="#FFFFFF" stroke="#E3DDED"/><text x="303" y="778" font-size="13" fill="#4A148C" font-weight="600" text-anchor="start">Mais transparência</text>
<rect x="570" y="0" width="870" height="960" rx="0" fill="#FFFFFF"/><text x="700" y="132" font-size="32" fill="#20133F" font-weight="700" text-anchor="start">Bem-vindo(a) de volta</text><text x="700" y="169" font-size="16" fill="#6B647C" font-weight="400" text-anchor="start">Entre na sua conta para continuar sua jornada.</text>
<text x="700" y="235" font-size="15" fill="#20133F" font-weight="600" text-anchor="start">Como você quer acessar?</text>
<rect x="700" y="258" width="500" height="64" rx="16" fill="#FCFBFE" stroke="#E3DDED"/><rect x="706" y="264" width="244" height="52" rx="12" fill="#6B2DBD"/><text x="828" y="296" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">Candidato</text><rect x="954" y="264" width="240" height="52" rx="12" fill="#FCFBFE"/><text x="1074" y="296" font-size="15" fill="#20133F" font-weight="600" text-anchor="middle">Empresa</text>
<text x="700" y="370" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">E-mail ou CPF</text><rect x="700" y="382" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="718" y="412" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">seuemail@exemplo.com ou CPF</text><text x="700" y="475" font-size="14" fill="#20133F" font-weight="600" text-anchor="start">Senha</text><rect x="700" y="487" width="500" height="48" rx="10" fill="#FFFFFF" stroke="#E3DDED"/><text x="718" y="517" font-size="14" fill="#958DA4" font-weight="400" text-anchor="start">Digite sua senha</text>
<rect x="701" y="575" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E3DDED"/><text x="729" y="590" font-size="13" fill="#6B647C" font-weight="400" text-anchor="start">Lembrar de mim</text><text x="1200" y="590" font-size="13" fill="#6B2DBD" font-weight="600" text-anchor="end">Esqueci minha senha</text>
<rect x="700" y="635" width="500" height="60" rx="14" fill="#6B2DBD"/><text x="950" y="672" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Entrar na plataforma  →</text>
<text x="950" y="755" font-size="14" fill="#6B647C" font-weight="400" text-anchor="middle">Ainda não tem uma conta? Cadastre-se</text><text x="950" y="782" font-size="14" fill="#6B2DBD" font-weight="700" text-anchor="middle">Cadastre-se</text>
<text x="700" y="870" font-size="12" fill="#6B647C" font-weight="400" text-anchor="start">Acesso público disponível para Candidato e Empresa.</text><text x="700" y="915" font-size="10" fill="#6B647C" font-weight="400" text-anchor="start">A administração da plataforma não é uma opção de login público.</text>
</svg>