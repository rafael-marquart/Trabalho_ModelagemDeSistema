<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Mensagens de autenticação — AcessaVagas</title><desc id="desc">Referência visual de mensagens de sucesso, informação e erro para os fluxos de autenticação, sem revelar se uma conta existe.</desc>
<rect width="1440" height="960" fill="#FBFAFE"/><rect width="1440" height="112" fill="#F5F0FC"/>
<circle cx="94" cy="56" r="26" fill="#6B29BF"/><path d="M83 58c0-10 7-17 15-17s15 7 15 17-7 17-15 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="142" y="52" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#4A148C">AcessaVagas</text><text x="143" y="78" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6B6380">Acesso que transforma.</text>
<text x="120" y="178" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#1F1440">Mensagens de autenticação</text><text x="120" y="210" font-family="Inter,Arial,sans-serif" font-size="16" fill="#6B6380">Mensagens claras, acessíveis e sem exposição de informações sensíveis.</text>
<rect x="120" y="254" width="1200" height="176" rx="18" fill="#FFFFFF" stroke="#E0D9EB"/>
<rect x="148" y="282" width="48" height="48" rx="14" fill="#E4F6E9"/><path d="M160 306l9 9 17-20" fill="none" stroke="#176B36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="220" y="296" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#176B36">SUCESSO</text><text x="220" y="326" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F1440">E-mail confirmado</text><text x="220" y="356" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Seu e-mail corporativo foi confirmado e sua conta empresarial está ativada.</text><rect x="220" y="377" width="190" height="36" rx="10" fill="#6B29BF"/><text x="315" y="400" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Ir para o login</text>
<rect x="120" y="458" width="1200" height="176" rx="18" fill="#FFFFFF" stroke="#E0D9EB"/>
<rect x="148" y="486" width="48" height="48" rx="14" fill="#E8E2F7"/><circle cx="172" cy="510" r="13" fill="none" stroke="#4A148C" stroke-width="3"/><path d="M172 503v8l6 4" fill="none" stroke="#4A148C" stroke-width="3" stroke-linecap="round"/>
<text x="220" y="500" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#4A148C">INFORMAÇÃO</text><text x="220" y="530" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F1440">Confira seu e-mail</text><text x="220" y="560" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Se os dados corresponderem a uma conta, enviaremos as instruções para o e-mail cadastrado.</text><text x="220" y="592" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6B6380">Essa mensagem não confirma se existe uma conta com os dados informados.</text>
<rect x="120" y="662" width="1200" height="176" rx="18" fill="#FFFFFF" stroke="#E0D9EB"/>
<rect x="148" y="690" width="48" height="48" rx="14" fill="#FDE9E8"/><circle cx="172" cy="714" r="13" fill="none" stroke="#B42318" stroke-width="3"/><path d="M172 706v9m0 6v1" stroke="#B42318" stroke-width="3" stroke-linecap="round"/>
<text x="220" y="704" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#B42318">ERRO</text><text x="220" y="734" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F1440">Não foi possível concluir a ação</text><text x="220" y="764" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Confira os dados e tente novamente. Se o problema continuar, solicite um novo link.</text><rect x="220" y="785" width="170" height="36" rx="10" fill="#FFFFFF" stroke="#6B29BF"/><text x="305" y="808" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#6B29BF">Tentar novamente</text>
<text x="120" y="886" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6B6380">Estados de mensagem de referência; texto final depende do contexto específico do fluxo.</text>
</svg>