<rect x="970" y="770" width="158" height="30" rx="15" fill="#F0EDF4"/><text x="1049" y="790" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#6B6380">Pendente</text><text x="1175" y="793" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#6B29BF">Reenviar</text><text x="1260" y="793" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6B6380">Cancelar</text>
<text x="304" y="900" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6B6380">Protótipo ilustrativo. A disponibilidade das ações depende do estado do convite ou vínculo.</text>
