<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Gestão de recrutadores — AcessaVagas</title><desc id="desc">Protótipo de gestão de recrutadores com lista de vínculos e formulário de convite, na identidade visual aprovada do AcessaVagas.</desc>
<rect width="1440" height="960" fill="#FBFAFE"/>
<rect width="1440" height="76" fill="#FFFFFF"/><path d="M0 75.5H1440" stroke="#E0D9EB"/>
