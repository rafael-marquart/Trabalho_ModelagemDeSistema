<text x="370" y="44" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Área da empresa</text>
<circle cx="1372" cy="38" r="21" fill="#F5F0FC"/><text x="1372" y="43" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#4A148C">AV</text>
<rect x="0" y="76" width="260" height="884" fill="#FFFFFF"/><path d="M259.5 76V960" stroke="#E0D9EB"/>
<text x="28" y="121" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#948CA3">MENU DA EMPRESA</text>
<rect x="16" y="145" width="228" height="46" rx="12" fill="#F5F0FC"/><rect x="16" y="145" width="4" height="46" rx="2" fill="#6B29BF"/>
<text x="38" y="173" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#4A148C">Recrutadores</text>
<text x="38" y="228" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Visão geral</text><text x="38" y="278" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Vagas da empresa</text><text x="38" y="328" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Candidaturas</text><text x="38" y="378" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6B6380">Configurações</text>
<text x="304" y="132" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#1F1440">Gestão de recrutadores</text>
<text x="304" y="164" font-family="Inter,Arial,sans-serif" font-size="16" fill="#6B6380">Gerencie quem pode atuar nos processos seletivos da sua empresa.</text>
<rect x="304" y="198" width="1104" height="184" rx="18" fill="#FFFFFF" stroke="#E0D9EB"/>
<text x="332" y="234" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1440">Convidar recrutador</text>
<text x="332" y="261" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6B6380">A pessoa receberá um link de uso único para aceitar o vínculo e, se necessário, configurar sua senha.</text>
<text x="332" y="294" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#1F1440">Nome completo</text><rect x="332" y="304" width="360" height="46" rx="10" fill="#FFFFFF" stroke="#E0D9EB"/><text x="348" y="332" font-family="Inter,Arial,sans-serif" font-size="14" fill="#948CA3">Nome da pessoa convidada</text>
<text x="714" y="294" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#1F1440">E-mail</text><rect x="714" y="304" width="390" height="46" rx="10" fill="#FFFFFF" stroke="#E0D9EB"/><text x="730" y="332" font-family="Inter,Arial,sans-serif" font-size="14" fill="#948CA3">pessoa@empresa.com</text>
<rect x="1120" y="304" width="260" height="46" rx="12" fill="#6B29BF"/><text x="1250" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Enviar convite</text>
<text x="304" y="430" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F1440">Pessoas vinculadas</text><text x="304" y="458" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6B6380">A lista apresenta as solicitações e os vínculos da empresa; o envio não confirma a elegibilidade do e-mail informado.</text>
